name: fish_guard
description: "FishGuard - Smart Monitoring for Safer Fish Logistics"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # MQTT Client
  mqtt_client: ^10.2.1

  # Charts
  fl_chart: ^0.69.0

  # Google Fonts
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.3

  # UUID for unique IDs
  uuid: ^4.5.1

  # Intl for date/time formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
